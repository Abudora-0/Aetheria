<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Aetheria animated logo">
  <defs>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1C5">
        <animate attributeName="stop-color" values="#4FD1C5;#8B5CF6;#F472B6;#4FD1C5" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="52%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#F472B6;#4FD1C5;#8B5CF6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F472B6">
        <animate attributeName="stop-color" values="#F472B6;#4FD1C5;#8B5CF6;#F472B6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="12" fill="none" stroke="url(#aurora)" stroke-width="2">
    <animate attributeName="r" values="12;74" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="url(#aurora)" stroke-linecap="round" filter="url(#glow)">
    <path d="M80 53 A 27 27 0 0 1 80 107" stroke-width="8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M80 35 A 45 45 0 0 1 80 125" stroke-width="7">
      <animate attributeName="opacity" values="0.3;0.62;0.3" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    <path d="M80 17 A 63 63 0 0 1 80 143" stroke-width="6">
      <animate attributeName="opacity" values="0.16;0.4;0.16" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="80" cy="80" r="8" fill="#F5C451" filter="url(#glow)">
    <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
