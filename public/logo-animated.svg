<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Aetheria animated logo">
  <defs>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1C5">
        <animate attributeName="stop-color" values="#4FD1C5;#8B5CF6;#F472B6;#4FD1C5" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="52%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#F472B6;#4FD1C5;#8B5CF6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F472B6">
        <animate attributeName="stop-color" values="#F472B6;#4FD1C5;#8B5CF6;#F472B6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="7" fill="none" stroke="url(#aurora)" stroke-width="2">
    <animate attributeName="r" values="7;58" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="url(#aurora)" filter="url(#glow)">
    <circle cx="80" cy="80" r="22" stroke-width="5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="80" r="38" stroke-width="4">
      <animate attributeName="opacity" values="0.26;0.5;0.26" dur="3.2s" begin="0.35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="80" r="54" stroke-width="3.5">
      <animate attributeName="opacity" values="0.14;0.28;0.14" dur="3.2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="80" cy="80" r="7.5" fill="#F5C451" filter="url(#glow)">
    <animate attributeName="r" values="7.5;9;7.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
